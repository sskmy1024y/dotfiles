name: Test Dotfiles Installation

on:
  push:
    branches: [ master, main, develop, 'feat/*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  bats-tests:
    name: Bats Tests - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install ShellCheck (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
      - name: Install ShellCheck (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install shellcheck
          
      - name: Install Bats
        run: |
          chmod +x test/install_bats.sh
          ./test/install_bats.sh
          
      - name: Run all Bats tests
        run: |
          chmod +x test/run_tests.sh
          ./test/run_tests.sh
          
      - name: Run tests in CI mode
        run: |
          ./test/run_tests.sh --ci > test-results.tap
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.tap

  individual-bats-tests:
    name: Individual Bats Test - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: [header, symlink, deploy, syntax]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
      - name: Install Bats
        run: |
          chmod +x test/install_bats.sh
          ./test/install_bats.sh
          
      - name: Run ${{ matrix.test }} tests
        run: |
          chmod +x test/run_tests.sh
          ./test/run_tests.sh ${{ matrix.test }}

  integration-test:
    name: Integration Test - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Test deployment
        run: |
          export DOTPATH=$PWD
          echo "Running deploy script..."
          echo "DOTPATH: $DOTPATH"
          echo "HOME: $HOME"
          
          # Move existing files that would conflict
          for file in .gitconfig .zshrc .bashrc; do
            if [ -f "$HOME/$file" ] && [ ! -L "$HOME/$file" ]; then
              echo "Moving existing $file to $file.backup"
              mv "$HOME/$file" "$HOME/$file.backup"
            fi
          done
          
          bash -x etc/scripts/deploy || { echo "Deploy script failed with exit code $?"; exit 1; }
          
      - name: Verify installation
        run: |
          # Debug: Show what was created
          echo "Contents of HOME directory:"
          ls -la "$HOME" || true
          echo "Contents of .local (if exists):"
          ls -la "$HOME/.local" || true
          echo "Contents of .local/bin (if exists):"
          ls -la "$HOME/.local/bin" || true
          
          # Check if key files were linked
          echo "Checking .zshrc..."
          test -L "$HOME/.zshrc" || { echo ".zshrc not found or not a symlink"; exit 1; }
          echo "Checking .gitconfig..."
          test -L "$HOME/.gitconfig" || { echo ".gitconfig not found or not a symlink"; exit 1; }
          echo "Checking .zsh directory..."
          test -d "$HOME/.zsh" || { echo ".zsh directory not found"; exit 1; }
          echo "Checking .local/bin directory..."
          test -d "$HOME/.local/bin" || { echo ".local/bin directory not found"; exit 1; }
          
      - name: Install Bats
        run: |
          chmod +x test/install_bats.sh
          ./test/install_bats.sh
          
      - name: Run integration tests with Bats
        run: |
          ./test/bats-runner test/test_symlink.bats
          ./test/bats-runner test/test_deploy.bats
          
      - name: Test installer entrypoint
        run: |
          bash etc/install --help

  docker-test:
    name: Docker Test - ${{ matrix.os }} - ${{ matrix.install }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu, archlinux]
        install: [remote, local]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build test image
        run: |
          cd test/docker
          docker build -f Dockerfile.${{ matrix.os }} -t dotfiles-test:${{ matrix.os }} .

      - name: Run installation test with Bats
        run: |
          cd test/docker
          setup_repo="${{ github.event.pull_request.head.repo.full_name || github.repository }}"
          setup_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          docker run --rm \
            -e CI=true \
            -e DOTFILES_BOOTSTRAP_URL="https://raw.githubusercontent.com/${setup_repo}/refs/heads/${setup_ref}/etc/bootstrap" \
            -e DOTFILES_GITHUB="https://github.com/${setup_repo}.git" \
            -e DOTFILES_BRANCH="${setup_ref}" \
            -v "${GITHUB_WORKSPACE}:/home/testuser/dotfiles-local:ro" \
            dotfiles-test:${{ matrix.os }} ./test_install.sh ${{ matrix.install }}

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      brewfile: ${{ steps.filter.outputs.brewfile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Full history so paths-filter can diff against the push's "before"
          # commit. With the default shallow clone it cannot find the base
          # commit and falls back to treating all files as changed, which
          # always triggers the (slow) brew-bundle job.
          fetch-depth: 0

      - name: Detect Brewfile changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            brewfile:
              - 'etc/scripts/install.d/Brewfile'

  macos-install-test:
    name: macOS Install Test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clear conflicting dotfiles
        run: |
          for file in .zshrc .gitconfig .gitignore.global .tmux.conf .czrc .goenvrc .ssh/config; do
            if [ -e "$HOME/$file" ] && [ ! -L "$HOME/$file" ]; then
              echo "Moving existing $file to $file.backup"
              mkdir -p "$(dirname "$HOME/$file.backup")"
              mv "$HOME/$file" "$HOME/$file.backup"
            fi
          done

      - name: Apply installer without brew
        run: |
          # On macOS etc/install enables the brew, macos_defaults and
          # 1password_ssh modules. --no-brew skips only the heavy brew bundle
          # while still exercising the symlink, macOS-defaults and 1Password
          # symlink modules plus the Terraform archive-install path.
          bash etc/install --yes --no-brew

      - name: Expose Terraform on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Preflight check
        run: bash etc/install --check

      - name: Verify installation
        run: |
          fail=0

          check_symlink() {
            if [ -L "$1" ]; then
              echo "✓ symlink: $1 -> $(readlink "$1")"
            else
              echo "✗ not a symlink: $1"; fail=1
            fi
          }

          check_mode() {
            local got
            got="$(stat -f %Lp "$1" 2>/dev/null || echo '??')"
            if [ "$got" = "$2" ]; then
              echo "✓ mode $2: $1"
            else
              echo "✗ mode $2 expected on $1 (got $got)"; fail=1
            fi
          }

          check_default() {
            local got
            got="$(defaults read "$1" "$2" 2>/dev/null || echo '??')"
            if [ "$got" = "$3" ]; then
              echo "✓ default $2 = $3"
            else
              echo "✗ default $2 expected $3 (got $got)"; fail=1
            fi
          }

          echo "--- symlinks ---"
          check_symlink "$HOME/.zshrc"
          check_symlink "$HOME/.gitconfig"
          check_symlink "$HOME/.gitignore.global"
          check_symlink "$HOME/.tmux.conf"
          check_symlink "$HOME/.local/bin/deploy"
          check_symlink "$HOME/.ssh/1password.conf"

          echo "--- zsh configs ---"
          if [ -d "$HOME/.zsh" ]; then
            zcount="$(find "$HOME/.zsh" -maxdepth 1 -type l -name '*.zsh' | wc -l | tr -d ' ')"
            if [ "$zcount" -gt 0 ]; then
              echo "✓ $zcount zsh symlinks"
            else
              echo "✗ no zsh symlinks under ~/.zsh"; fail=1
            fi
          else
            echo "✗ ~/.zsh directory missing"; fail=1
          fi

          echo "--- ssh permissions ---"
          check_mode "$HOME/.ssh" 700
          if [ -e "$HOME/.ssh/authorized_keys" ]; then
            check_mode "$HOME/.ssh/authorized_keys" 600
          else
            echo "✗ ~/.ssh/authorized_keys missing"; fail=1
          fi

          echo "--- terraform ---"
          if command -v terraform >/dev/null 2>&1; then
            echo "✓ terraform: $(command -v terraform)"
          else
            echo "✗ terraform not found on PATH"; fail=1
          fi

          echo "--- macOS defaults (runtime) ---"
          check_default -g InitialKeyRepeat 10
          check_default -g KeyRepeat 2
          check_default -g ApplePressAndHoldEnabled 0

          exit "$fail"

      - name: Installer help
        run: bash etc/install --help

  macos-brew-test:
    name: macOS Brew Bundle Test
    needs: detect-changes
    if: needs.detect-changes.outputs.brewfile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clear conflicting dotfiles
        run: |
          for file in .zshrc .gitconfig .gitignore.global .tmux.conf .czrc .goenvrc .ssh/config; do
            if [ -e "$HOME/$file" ] && [ ! -L "$HOME/$file" ]; then
              echo "Moving existing $file to $file.backup"
              mkdir -p "$(dirname "$HOME/$file.backup")"
              mv "$HOME/$file" "$HOME/$file.backup"
            fi
          done

      - name: Apply installer with brew bundle
        run: |
          # Full apply: the Terraform brew module runs
          # `brew bundle --file etc/scripts/install.d/Brewfile` (the real
          # production path). Gated to Brewfile changes / manual runs because
          # it pulls heavy GUI casks (docker-desktop, gcloud-cli, fonts).
          bash etc/install --yes

      - name: Verify a representative formula
        run: |
          if brew list jq >/dev/null 2>&1; then
            echo "✓ jq installed via brew bundle"
          else
            echo "✗ jq not installed by brew bundle"; exit 1
          fi

  syntax-check:
    name: Syntax and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
      - name: Check bash syntax
        run: |
          for script in $(find . -name "*.sh" -type f); do
            echo "Checking: $script"
            bash -n "$script"
          done
          bash -n etc/install
          bash -n etc/bootstrap
          bash -n etc/setup
          
      - name: Run ShellCheck
        run: |
          for script in $(find . -name "*.sh" -type f ! -path "./test/bats/*"); do
            echo "Checking: $script"
            shellcheck -e SC1090,SC1091,SC2034 "$script" || true
          done
          
      - name: Install Bats and run syntax tests
        run: |
          chmod +x test/install_bats.sh
          ./test/install_bats.sh
          ./test/bats-runner test/test_syntax.bats

  all-tests-summary:
    name: All Tests Summary
    needs: [bats-tests, individual-bats-tests, integration-test, docker-test, syntax-check, macos-install-test, macos-brew-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          # macos-brew-test is skipped unless the Brewfile changed (or the run
          # was manually dispatched), so "skipped" counts as a pass for it.
          brew_result="${{ needs.macos-brew-test.result }}"
          if [ "${{ needs.bats-tests.result }}" != "success" ] || \
             [ "${{ needs.individual-bats-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ] || \
             [ "${{ needs.docker-test.result }}" != "success" ] || \
             [ "${{ needs.syntax-check.result }}" != "success" ] || \
             [ "${{ needs.macos-install-test.result }}" != "success" ] || \
             { [ "$brew_result" != "success" ] && [ "$brew_result" != "skipped" ]; }; then
            echo "Some tests failed!"
            exit 1
          else
            echo "All tests passed!"
          fi
